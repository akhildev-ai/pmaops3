name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate sample telemetry
        run: |
          python sensor-simulator/generate_historical_data.py --machines 6 --days 7 --frequency-minutes 60 --failure-probability 0.03 --anomaly-probability 0.08 --output artifacts/test_historical.parquet

      - name: Train baseline model
        run: |
          python ml-training/train_baseline.py --input artifacts/test_historical.parquet --output artifacts/model_package.joblib

      - name: Run tests
        run: |
          pytest -q



